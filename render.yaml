services:
  - type: web
    name: fractal-recuris-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FRONTEND_ORIGINS
        value: https://apalavra.github.io
      - key: MEMORY_FILE
        value: skill_memory.json
